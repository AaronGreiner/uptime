# Publishes the container image to the GitHub container registry.
#
# It listens on the same `v*` tag as deploy.yml but stays a separate workflow:
# shipping an image the world can pull and updating the one instance that runs
# on systemd are independent, and neither failing should block the other.
#
# The image is built once for the build platform and only assembled per target
# architecture, because the Nuxt output is plain JavaScript — see the Dockerfile.
# QEMU is therefore needed for the runtime stage alone, which is little more than
# an apt-get.
name: Docker

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      # A pull request only proves the image still builds; nothing is pushed
      # from a fork, and a single architecture is enough for that.
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: env.PUSH == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased by the action, which the registry requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
          labels: |
            org.opencontainers.image.title=Uptime
            org.opencontainers.image.description=A minimal, self-hosted uptime monitor with editable dashboards.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
