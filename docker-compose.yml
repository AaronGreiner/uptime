# Runs the published image. Everything has a working default, so this file alone
# is enough — `docker compose up -d` starts an instance whose admin password is
# printed to the log once.
#
# To build from a checkout instead of pulling, add `build: .` to the service and
# run `docker compose up -d --build`.
services:
  uptime:
    # Also published as the full version, the minor and the major, so an
    # upgrade can be pinned as narrowly as you like.
    image: ghcr.io/aarongreiner/uptime:latest
    restart: unless-stopped
    ports:
      - "3000:3000"

    # Optional, and the place for everything in .env.example. Without it the
    # entrypoint generates a session password and keeps it in the volume.
    # The long form needs Compose 2.24 or newer; older versions want `- .env`
    # and then the file has to exist.
    env_file:
      - path: .env
        required: false

    environment:
      # These two describe the image's own layout and must win over anything
      # .env carries, or a copied .env.example would put the database in the
      # container layer instead of the volume and lose it on the next upgrade.
      NUXT_DATABASE_PATH: /data/uptime.db
      NUXT_MIGRATIONS_DIR: /app/drizzle

    volumes:
      - uptime-data:/data

    sysctls:
      # Allows unprivileged ICMP sockets, which ping monitors rely on.
      net.ipv4.ping_group_range: "0 2147483647"

volumes:
  uptime-data:
